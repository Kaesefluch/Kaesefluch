<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Der Käsefluch - Battlerap Timeline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 60px;
            animation: fadeIn 0.8s ease-in;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .timeline {
            position: relative;
            padding: 20px 0;
        }

        /* Mittellinie */
        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: rgba(255, 255, 255, 0.3);
            top: 0;
        }

        .timeline-item {
            margin-bottom: 50px;
            animation: slideIn 0.6s ease-out forwards;
            opacity: 0;
        }

        .timeline-item:nth-child(1) { animation-delay: 0.1s; }
        .timeline-item:nth-child(2) { animation-delay: 0.2s; }
        .timeline-item:nth-child(3) { animation-delay: 0.3s; }
        .timeline-item:nth-child(4) { animation-delay: 0.4s; }
        .timeline-item:nth-child(5) { animation-delay: 0.5s; }
        .timeline-item:nth-child(6) { animation-delay: 0.6s; }

        /* Alternating left/right */
        .timeline-item:nth-child(odd) .content {
            margin-left: 0;
            margin-right: 52%;
            text-align: right;
        }

        .timeline-item:nth-child(even) .content {
            margin-left: 52%;
            margin-right: 0;
            text-align: left;
        }

        /* Dots on timeline */
        .timeline-item::before {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 16px;
            background: white;
            border: 4px solid #667eea;
            border-radius: 50%;
            top: 20px;
            z-index: 1;
        }

        .content {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .content:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .content.current {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: 2px solid white;
        }

        .content.current .label,
        .content.current .date {
            color: white;
        }

        .mc-names {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 15px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .timeline-item:nth-child(odd) .mc-names {
            flex-direction: row-reverse;
        }

        .mc {
            background: #667eea;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95em;
        }

        .content.current .mc {
            background: rgba(255, 255, 255, 0.3);
        }

        .arrow {
            font-size: 1.5em;
            opacity: 0.7;
        }

        .date {
            font-size: 0.85em;
            color: #999;
            margin-bottom: 8px;
        }

        .content.current .date {
            color: rgba(255, 255, 255, 0.8);
        }

        .timestamp {
            display: inline-block;
            background: #f0f0f0;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.85em;
            margin-bottom: 10px;
        }

        .content.current .timestamp {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .video-link {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 16px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.9em;
            transition: background 0.3s ease;
        }

        .video-link:hover {
            background: #764ba2;
        }

        .content.current .video-link {
            background: rgba(255, 255, 255, 0.3);
        }

        .thumbnail {
            width: 100%;
            max-width: 300px;
            height: 170px;
            background: #e0e0e0;
            border-radius: 8px;
            margin-top: 12px;
            overflow: hidden;
            object-fit: cover;
        }

        .label {
            display: inline-block;
            background: #764ba2;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75em;
            margin-bottom: 8px;
            font-weight: bold;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .current-badge {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #f5576c;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
            }
            50% {
                box-shadow: 0 4px 25px rgba(245, 87, 108, 0.8);
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .timeline::before {
                left: 20px;
            }

            .timeline-item::before {
                left: 20px;
            }

            .timeline-item:nth-child(odd) .content,
            .timeline-item:nth-child(even) .content {
                margin-left: 60px;
                margin-right: 0;
                text-align: left;
            }

            .timeline-item:nth-child(odd) .mc-names {
                flex-direction: row;
            }

            .current-badge {
                top: 10px;
                right: 10px;
                padding: 8px 16px;
                font-size: 0.9em;
            }
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
        }

        .error {
            text-align: center;
            color: #ff6b6b;
            background: white;
            padding: 20px;
            border-radius: 12px;
            max-width: 500px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="current-badge" id="currentBadge"></div>

    <div class="container">
        <div class="header">
            <h1>🧀 Der Käsefluch 🧀</h1>
            <p>Battlerap Timeline</p>
        </div>

        <div class="timeline" id="timeline">
            <div class="loading">Wird geladen...</div>
        </div>
    </div>

    <script>
        async function loadTimeline() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('Konnte data.json nicht laden');
                
                const data = await response.json();
                renderTimeline(data);
            } catch (error) {
                console.error(error);
                document.getElementById('timeline').innerHTML = `
                    <div class="error">
                        <p>❌ Fehler beim Laden der Daten</p>
                        <p style="font-size: 0.9em; margin-top: 10px;">${error.message}</p>
                    </div>
                `;
            }
        }

        function renderTimeline(data) {
            // Umgekehrte Reihenfolge: neuste zuerst (oben)
            const reversedData = [...data].reverse();
            
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = '';

            reversedData.forEach((item, index) => {
                const isCurrentYear = index === 0;
                const itemDiv = document.createElement('div');
                itemDiv.className = `timeline-item ${isCurrentYear ? 'current' : ''}`;

                let thumbnailHTML = '';
                if (item.thumbnail) {
                    thumbnailHTML = `<img src="${item.thumbnail}" alt="Thumbnail" class="thumbnail">`;
                }

                let currentLabel = '';
                if (isCurrentYear) {
                    currentLabel = '<span class="label">🔥 AKTUELL 🔥</span>';
                }

                itemDiv.innerHTML = `
                    <div class="content ${isCurrentYear ? 'current' : ''}">
                        ${currentLabel}
                        <div class="date">${new Date(item.date).toLocaleDateString('de-DE', { year: 'numeric', month: 'long', day: 'numeric' })}</div>
                        <div class="mc-names">
                            <span class="mc">${item.from}</span>
                            <span class="arrow">→</span>
                            <span class="mc">${item.to}</span>
                        </div>
                        ${item.timestamp ? `<div class="timestamp">⏱️ ${item.timestamp}</div>` : ''}
                        <a href="${item.videoLink}" target="_blank" class="video-link">🎥 Zum Video</a>
                        ${thumbnailHTML}
                    </div>
                `;

                timeline.appendChild(itemDiv);
            });

            // Update current badge
            const current = data[data.length - 1];
            document.getElementById('currentBadge').textContent = `🧀 ${current.to} 🧀`;
        }

        // Timeline beim Laden render
        loadTimeline();
    </script>
</body>
</html>
